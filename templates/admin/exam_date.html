{% extends 'admin/base_admin.html' %}{% block content %}<h1>Exam Dates</h1><div class="card"><form method="post"><label>Exam</label><select name="exam_id" required>{% for e in exams %}<option value="{{e.id}}">{{e.exam_name}}</option>{% endfor %}</select><label>Exam Date</label><input type="date" name="exam_date" required><button class="btn">Update Date</button></form></div><div class="card"><table class="table"><tr><th>Exam</th><th>Date</th></tr>{% for e in exams %}<tr><td>{{e.exam_name}}</td><td>{{e.exam_date or 'Not announced'}}</td></tr>{% endfor %}</table></div>{% endblock %}
