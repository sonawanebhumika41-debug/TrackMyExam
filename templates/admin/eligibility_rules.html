{% extends 'admin/base_admin.html' %}{% block content %}<h1>Eligibility Rules</h1><div class="card"><form method="post"><div class="row"><div><label>Exam</label><select name="exam_id" required>{% for e in exams %}<option value="{{e.id}}">{{e.exam_name}}</option>{% endfor %}</select></div><div><label>Minimum Age</label><input type="number" name="minimum_age"></div><div><label>Maximum Age</label><input type="number" name="maximum_age"></div><div><label>Qualification</label><input name="qualification"></div><div><label>Nationality</label><input name="nationality"></div><div><label>Category</label><input name="category"></div></div><label>Other Requirements</label><textarea name="other_requirements"></textarea><button class="btn">Add Rule</button></form></div><div class="card"><table class="table"><tr><th>Exam</th><th>Age</th><th>Qualification</th><th>Actions</th></tr>{% for r in rules %}<tr><td>{{r.exam.exam_name}}</td><td>{{r.minimum_age or '—'}} - {{r.maximum_age or '—'}}</td><td>{{r.qualification or 'Any'}}</td><td><a class="btn" href="{{url_for('edit_eligibility',rule_id=r.id)}}">Edit</a> <a class="btn danger" href="{{url_for('delete_eligibility',rule_id=r.id)}}">Delete</a></td></tr>{% endfor %}</table></div>{% endblock %}
