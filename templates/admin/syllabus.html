{% extends 'admin/base_admin.html' %}{% block content %}<h1>Syllabus Management</h1><div class="card"><form method="post"><label>Exam</label><select name="exam_id">{% for e in exams %}<option value="{{e.id}}">{{e.exam_name}}</option>{% endfor %}</select><label>Subject</label><input name="subject" required><label>Topic</label><input name="topic" required><button class="btn">Add Syllabus Topic</button></form></div><div class="card"><table class="table"><tr><th>Exam</th><th>Subject</th><th>Topic</th></tr>{% for i in items %}<tr><td>{{i.exam.exam_name}}</td><td>{{i.subject}}</td><td>{{i.topic}}</td></tr>{% endfor %}</table></div>{% endblock %}
