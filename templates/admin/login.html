<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackMyExam — Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { min-height:100vh; background:#f5f8fd; display:flex; align-items:center; justify-content:center; }
        .login-card { width:100%; max-width:430px; background:white; border:1px solid #e4e9f2; border-radius:18px; padding:32px; box-shadow:0 12px 35px rgba(16,24,40,.08); }
        .logo { width:46px; height:46px; border-radius:12px; background:#0B1F3A; color:white; display:flex; align-items:center; justify-content:center; font-size:1.3rem; }
        .form-control { padding:.75rem .9rem; border-radius:10px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="d-flex align-items-center gap-3 mb-4">
        <div class="logo"><i class="bi bi-bullseye"></i></div>
        <div><h4 class="mb-0 fw-bold">TrackMyExam</h4><small class="text-secondary">Admin Panel</small></div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <h5 class="fw-bold">Admin Login</h5>
    <p class="text-secondary small mb-4">Login to manage competitive exams, dates and eligibility rules.</p>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" placeholder="admin@example.com" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button class="btn btn-primary w-100 py-2"><i class="bi bi-box-arrow-in-right me-2"></i>Login</button>
    </form>
</div>
</body>
</html>
