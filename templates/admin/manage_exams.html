{% extends 'admin/base_admin.html' %}{% block content %}<h1>Manage Exams</h1><div class="card"><h3>Add Exam</h3><form method="post"><div class="row"><div><label>Exam Name</label><input name="exam_name" required></div><div><label>Exam Date</label><input type="date" name="exam_date"></div></div><label>Description</label><textarea name="description"></textarea><label>Status</label><select name="status"><option>Active</option><option>Inactive</option></select><button class="btn">Add Exam</button></form></div><div class="card"><h3>Existing Exams</h3><table class="table"><tr><th>Name</th><th>Date</th><th>Status</th><th>Actions</th></tr>{% for e in exams %}<tr><td>{{e.exam_name}}</td><td>{{e.exam_date or 'Not announced'}}</td><td>{{e.status}}</td><td><a class="btn" href="{{url_for('edit_exam',exam_id=e.id)}}">Edit</a> <a class="btn danger" href="{{url_for('delete_exam',exam_id=e.id)}}" onclick="return confirm('Delete this exam?')">Delete</a></td></tr>{% endfor %}</table></div>{% endblock %}
