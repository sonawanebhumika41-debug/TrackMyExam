{% extends 'admin/base_admin.html' %}{% block content %}<h1>Question Bank</h1><div class="card"><h3>Add Question</h3><form method="post"><label>Question Paper</label><select name="question_paper_id" required>{% for p in papers %}<option value="{{p.id}}">{{p.exam.exam_name}} - {{p.year}} - {{p.title}}</option>{% endfor %}</select><div class="row"><div><label>Subject</label><input name="subject"></div><div><label>Topic</label><input name="topic"></div><div><label>Difficulty</label><select name="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></div></div><label>Question</label><textarea name="question_text" required></textarea><div class="row"><div><label>Option A</label><input name="option_a" required></div><div><label>Option B</label><input name="option_b" required></div><div><label>Option C</label><input name="option_c" required></div><div><label>Option D</label><input name="option_d" required></div></div><label>Correct Answer</label><select name="correct_answer"><option>A</option><option>B</option><option>C</option><option>D</option></select><label>Explanation</label><textarea name="explanation"></textarea><button class="btn">Add Question</button></form></div><div class="card"><h3>Questions</h3><table class="table"><tr><th>Exam/Year</th><th>Question</th><th>Difficulty</th><th></th></tr>{% for q in questions %}<tr><td>{{q.question_paper.exam.exam_name}} / {{q.question_paper.year}}</td><td>{{q.question_text}}</td><td>{{q.difficulty}}</td><td><a class="btn danger" href="{{url_for('delete_question',question_id=q.id)}}">Delete</a></td></tr>{% endfor %}</table></div>{% endblock %}
