{% extends 'admin/base_admin.html' %}{% block content %}<h1>Edit Eligibility Rule</h1><div class="card"><form method="post"><label>Exam</label><select name="exam_id">{% for e in exams %}<option value="{{e.id}}" {% if e.id==rule.exam_id %}selected{% endif %}>{{e.exam_name}}</option>{% endfor %}</select><div class="row"><div><label>Minimum Age</label><input name="minimum_age" value="{{rule.minimum_age or ''}}"></div><div><label>Maximum Age</label><input name="maximum_age" value="{{rule.maximum_age or ''}}"></div><div><label>Qualification</label><input name="qualification" value="{{rule.qualification or ''}}"></div><div><label>Nationality</label><input name="nationality" value="{{rule.nationality or ''}}"></div><div><label>Category</label><input name="category" value="{{rule.category or ''}}"></div></div><label>Other Requirements</label><textarea name="other_requirements">{{rule.other_requirements or ''}}</textarea><button class="btn">Save</button></form></div>{% endblock %}
