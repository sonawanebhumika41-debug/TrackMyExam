{% extends 'student/base_student.html' %}{% block content %}<h1>My Notes</h1><div class="card"><form method="post"><label>Title</label><input name="title" required><label>Content</label><textarea name="content" rows="5" required></textarea><button class="btn">Save Note</button></form></div>{% for n in notes %}<div class="card"><h3>{{n.title}}</h3><p>{{n.content}}</p><a class="btn danger" href="{{url_for('delete_note',note_id=n.id)}}">Delete</a></div>{% else %}<div class="card">No notes yet.</div>{% endfor %}{% endblock %}
