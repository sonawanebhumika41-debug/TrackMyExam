{% extends 'student/base_student.html' %}{% block content %}<h1>Study Planner</h1><div class="card"><form method="post"><div class="row"><div><label>Task</label><input name="task" required placeholder="Study Indian Polity"></div><div><label>Date</label><input type="date" name="study_date"></div></div><label>Subject</label><input name="subject"><button class="btn">Add Task</button></form></div><div class="card"><table class="table"><tr><th>Task</th><th>Subject</th><th>Date</th><th></th></tr>{% for p in plans %}<tr><td>{{p.task}}</td><td>{{p.subject or '—'}}</td><td>{{p.study_date or '—'}}</td><td><a class="btn danger" href="{{url_for('delete_plan',plan_id=p.id)}}">Delete</a></td></tr>{% endfor %}</table></div>{% endblock %}
