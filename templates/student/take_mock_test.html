{% extends 'student/base_student.html' %}{% block content %}<h1>{{test.exam.exam_name}} — Mock Test</h1><p class="muted">Source years: {{test.selected_years}}{% if test.prompt %} | Prompt: {{test.prompt}}{% endif %}</p><form method="post">{% for q in questions %}<div class="card question"><h3>Q{{loop.index}}. {{q.question_text}}</h3><label><input type="radio" name="q_{{q.id}}" value="A"> A. {{q.option_a}}</label><label><input type="radio" name="q_{{q.id}}" value="B"> B. {{q.option_b}}</label><label><input type="radio" name="q_{{q.id}}" value="C"> C. {{q.option_c}}</label><label><input type="radio" name="q_{{q.id}}" value="D"> D. {{q.option_d}}</label></div>{% endfor %}<button class="btn" type="submit">Submit Test</button></form>{% endblock %}
