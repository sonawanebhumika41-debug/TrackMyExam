<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackMyExam — Loading</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy-900:#0B1F3A;
  --navy-800:#122B52;
  --navy-700:#1A3A6B;
  --blue-700:#1D4ED8;
  --blue-600:#2563EB;
  --blue-500:#3B82F6;
  --blue-100:#E8F0FE;
  --sky-50:#F5F8FD;
  --white:#FFFFFF;
  --ink-900:#101828;
  --ink-600:#475467;
  --ink-400:#98A2B3;
  --line:#E4E9F2;
  --font-display:'Poppins',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}

*{
  box-sizing:border-box;
}

html,body{
  height:100%;
}

body{
  margin:0;
  font-family:var(--font-body);
  background:
    radial-gradient(
      1100px 600px at 15% -10%,
      rgba(59,130,246,.35),
      transparent 60%
    ),
    radial-gradient(
      900px 500px at 110% 110%,
      rgba(29,78,216,.30),
      transparent 55%
    ),
    linear-gradient(
      160deg,
      var(--navy-900) 0%,
      var(--navy-800) 55%,
      var(--navy-700) 100%
    );

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

/* Faint dotted grid backdrop */
body::before{
  content:"";
  position:fixed;
  inset:0;

  background-image:
    radial-gradient(
      rgba(255,255,255,.10) 1px,
      transparent 1px
    );

  background-size:26px 26px;
  pointer-events:none;
}

.splash-wrap{
  text-align:center;
  color:var(--white);
  position:relative;
  z-index:1;
}

/* Signature: exam countdown ring */
.ring-shell{
  position:relative;
  width:168px;
  height:168px;
  margin:0 auto 28px;
}

.ring-shell svg{
  width:100%;
  height:100%;
  transform:rotate(-90deg);
}

.ring-track{
  fill:none;
  stroke:rgba(255,255,255,.12);
  stroke-width:6;
}

.ring-progress{
  fill:none;
  stroke:url(#ringGradient);
  stroke-width:6;
  stroke-linecap:round;

  stroke-dasharray:472;
  stroke-dashoffset:472;

  animation:
    drawRing 2.2s cubic-bezier(.65,0,.35,1) forwards;
}

@keyframes drawRing{
  to{
    stroke-dashoffset:60;
  }
}

.ring-center{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-direction:column;
}

.ring-mark{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.9rem;
  letter-spacing:.5px;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #BFD7FF
    );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.ring-mark-sub{
  font-family:var(--font-mono);
  font-size:.68rem;
  letter-spacing:2px;
  color:#9FC0FF;
  margin-top:2px;
}

.brand-name{
  font-family:var(--font-display);
  font-weight:700;
  font-size:2rem;
  letter-spacing:.3px;
  margin-bottom:6px;
}

.brand-tag{
  font-family:var(--font-body);
  font-size:.95rem;
  color:#B9CCF0;
  letter-spacing:.4px;
  margin-bottom:34px;
}

.loader-track{
  width:220px;
  height:4px;
  border-radius:99px;
  background:rgba(255,255,255,.14);

  overflow:hidden;

  margin:0 auto 14px;
}

.loader-fill{
  height:100%;
  width:0%;

  border-radius:99px;

  background:
    linear-gradient(
      90deg,
      #3B82F6,
      #93C5FD
    );

  animation:
    fillBar 2.3s ease forwards;
}

@keyframes fillBar{
  to{
    width:100%;
  }
}

.loader-status{
  font-family:var(--font-mono);
  font-size:.72rem;
  letter-spacing:1.5px;
  color:#8FADE0;
  text-transform:uppercase;
}

@media (prefers-reduced-motion: reduce){
  .ring-progress,
  .loader-fill{
    animation-duration:.01s;
  }
}
</style>
</head>

<body>

<div class="splash-wrap">

  <div class="ring-shell">

    <svg viewBox="0 0 168 168">

      <defs>

        <linearGradient
          id="ringGradient"
          x1="0%"
          y1="0%"
          x2="100%"
          y2="100%"
        >
          <stop
            offset="0%"
            stop-color="#93C5FD"
          />

          <stop
            offset="100%"
            stop-color="#3B82F6"
          />
        </linearGradient>

      </defs>

      <circle
        class="ring-track"
        cx="84"
        cy="84"
        r="75">
      </circle>

      <circle
        class="ring-progress"
        cx="84"
        cy="84"
        r="75">
      </circle>

    </svg>

    <div class="ring-center">

      <i
        class="bi bi-mortarboard-fill"
        style="font-size:1.6rem;color:#DCE9FF;">
      </i>

      <div
        class="ring-mark-sub"
        style="margin-top:6px;">
        TME
      </div>

    </div>

  </div>

  <div class="brand-name">
    TrackMy<span style="color:#7FB0FF;">Exam</span>
  </div>

  <div class="brand-tag">
    Plan &nbsp;•&nbsp; Prepare &nbsp;•&nbsp; Perform
  </div>

  <div class="loader-track">
    <div class="loader-fill"></div>
  </div>

  <div class="loader-status">
    Setting up your dashboard…
  </div>

</div>

<!-- Flask Redirect -->
<script>
  setTimeout(function () {
      window.location.href = "{{ url_for('login') }}";
  }, 2600);
</script>

</body>
</html>
