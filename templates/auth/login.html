<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackMyExam Login</title><style>body{font-family:Arial;margin:0;background:#eef2ff;min-height:100vh;display:grid;place-items:center}.box{background:white;width:min(430px,92%);padding:32px;border-radius:16px;box-shadow:0 15px 45px #0002}h1{margin-top:0}input,select{width:100%;padding:12px;margin:7px 0 16px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;border:0;border-radius:8px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.roles button{background:#e2e8f0;color:#334155}.roles button.active{background:#2563eb;color:white}.flash{padding:10px;background:#fee2e2;color:#991b1b;border-radius:8px;margin-bottom:12px}.link{text-align:center;margin-top:15px}.link a{color:#2563eb;text-decoration:none;font-weight:700}</style></head><body><div class="box"><h1>TrackMyExam</h1><p>Login to your competitive exam preparation account.</p>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}<div class="roles"><button type="button" id="studentBtn" class="active" onclick="setRole('student')">Student Login</button><button type="button" id="adminBtn" onclick="setRole('admin')">Admin Login</button></div><form method="post" action="{{url_for('login')}}"><input type="hidden" name="login_type" id="login_type" value="student"><label>Email</label><input type="email" name="email" required placeholder="Enter email"><label>Password</label><input type="password" name="password" required placeholder="Enter password"><button type="submit">Login</button></form><div class="link">New student? <a href="{{url_for('register')}}">Create Account</a></div></div><script>function setRole(role){document.getElementById('login_type').value=role;document.getElementById('studentBtn').classList.toggle('active',role==='student');document.getElementById('adminBtn').classList.toggle('active',role==='admin')}</script></body></html>
